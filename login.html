<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In | Kwiklance</title>
    <script
      src="https://kit.fontawesome.com/c151b848a4.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <a href="login.html" class="brand">
      <img src="images/logo.png" alt="KWIKLANCE" class="brand-logo" />
    </a>

    <div class="login-bg" aria-hidden="true">
      <div class="login-col-wrapper">
        <div class="login-col login-col--1"></div>
      </div>
      <div class="login-col-wrapper">
        <div class="login-col login-col--2"></div>
      </div>
      <div class="login-col-wrapper">
        <div class="login-col login-col--3"></div>
      </div>
    </div>

    <main class="login-stage">
      <section class="login-card">
        <h1 class="login-title">Login Now</h1>

        <form class="login-form" novalidate>
          <div class="field">
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="Email address"
              required
            />
          </div>

          <div class="field field--password">
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Password"
              required
            />
            <button
              type="button"
              class="toggle-pass"
              aria-pressed="false"
              aria-label="Show password"
            >
              <i class="fa-regular fa-eye icon-eye"></i>
              <i class="fa-regular fa-eye-slash icon-eye-off"></i>
            </button>
          </div>

          <button type="submit" class="login-btn">
            <span>Login</span>
          </button>
        </form>

        <a href="forgot.html" class="forgot-link">Forgot Password?</a>

        <p class="register-line">
          <span class="register-text">Don't have an account?</span>
          <a href="register.html" class="register-link">Register now</a>
        </p>
      </section>
    </main>

    <script src="js/login.js"></script>
  </body>
</html>
